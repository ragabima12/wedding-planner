<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta
      name="description"
      content="Atur anggaran, vendor, tamu, dan persiapan pernikahan bersama keluarga."
    />
    <title>Rencana Nikah</title>
    <script>
      try {
        const t = localStorage.getItem('vueuse-color-scheme')
        if (
          t === 'dark' ||
          ((!t || t === 'auto') && matchMedia('(prefers-color-scheme: dark)').matches)
        )
          document.documentElement.classList.add('dark')
      } catch {}
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
